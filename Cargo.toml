[workspace]
resolver = "3"
members = ["crates/factory-protocol", "crates/factory-core", "crates/factory-cli", "crates/factory-bevy", "crates/factory-tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "=0.19.0", default-features = false, features = ["2d", "ui"] }
clap = { version = "4.5", features = ["derive"] }
factory-core = { path = "crates/factory-core" }
factory-protocol = { path = "crates/factory-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
